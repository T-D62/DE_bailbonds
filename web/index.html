<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bail Bonds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app" class="app" aria-hidden="true">
        <section class="panel" role="dialog" aria-modal="true" aria-labelledby="title">
            <header class="header">
                <div>
                    <p class="eyebrow">PUBLIC SERVICES</p>
                    <h1 id="title">Bail Bonds</h1>
                    <p class="subtitle">Select an outstanding bond to pay for someone.</p>
                </div>
                <button id="close" class="icon-button" type="button" aria-label="Close menu">×</button>
            </header>

            <div class="summary">
                <div>
                    <span class="summary-label">OUTSTANDING</span>
                    <strong id="outstanding-total">$0</strong>
                </div>
                <div class="summary-count"><strong id="outstanding-count">0</strong><span>unpaid bonds</span></div>
            </div>

            <nav class="tabs" aria-label="Bond list">
                <button class="tab active" type="button" data-view="unpaid">Available</button>
                <button class="tab" type="button" data-view="paid">Paid history</button>
            </nav>

            <p id="status" class="status" role="status" aria-live="polite"></p>
            <div id="bond-list" class="bond-list"></div>
            <footer>
                <span>Payments are charged to your <b id="account-name">bank</b> account.</span>
                <span>ESC to close</span>
            </footer>
        </section>
        <div id="confirm" class="confirm-backdrop" hidden>
            <section class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
                <p class="eyebrow">PAYMENT CONFIRMATION</p>
                <h2 id="confirm-title">Pay this bond?</h2>
                <p id="confirm-copy"></p>
                <div class="confirm-actions">
                    <button id="cancel-payment" class="button secondary" type="button">Cancel</button>
                    <button id="confirm-payment" class="button primary" type="button">Confirm payment</button>
                </div>
            </section>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
